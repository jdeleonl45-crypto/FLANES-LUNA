<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flanes Luna - Pedidos en Línea</title>
  <style>
    :root {
      --primary: #5c2c16;
      --secondary: #d4a373;
      --accent: #2e7d32;
      --bg: #fefae0;
      --card-bg: #ffffff;
      --text: #333333;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--secondary); padding-bottom: 10px; }
    header h1 { color: var(--primary); font-size: 26px; }
    header p { color: #666; font-size: 14px; }

    .product-card { display: flex; flex-direction: column; align-items: center; background: #fff8f0; padding: 15px; border-radius: 10px; border: 1px solid #fae1dd; margin-bottom: 20px; }
    .product-card img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .product-price { font-size: 18px; font-weight: bold; color: var(--primary); margin: 5px 0; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: var(--primary); }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    
    .counter { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 5px; }
    .counter button { width: 35px; height: 35px; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; }
    .counter span { font-size: 18px; font-weight: bold; }

    .summary-box { background: #e8f5e9; border: 1px dashed var(--accent); padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center; }
    .summary-box h3 { color: var(--accent); margin-bottom: 5px; }
    .total-price { font-size: 22px; font-weight: bold; color: var(--accent); }

    .btn-submit { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-submit:hover { background: #1b5e20; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 450px; width: 90%; text-align: center; }
    .ticket { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; text-align: left; margin: 15px 0; font-family: monospace; font-size: 13px; }
    .close-btn { background: #c62828; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Flanes Luna 🍮</h1>
    <p>Sistema de Pedidos y Entrega Express Escolar / Universitaria</p>
  </header>

  <form id="orderForm">
    <!-- Producto y Cantidad -->
    <div class="product-card">
      <h3>Porción de Chocoflan Gourmet</h3>
      <p class="product-price">Q 15.00 por porción</p>
      <div class="form-group" style="width: 100%;">
        <label style="text-align: center;">Cantidad de Porciones:</label>
        <div class="counter">
          <button type="button" onclick="updateQty(-1)">-</button>
          <span id="qtyDisplay">1</span>
          <button type="button" onclick="updateQty(1)">+</button>
        </div>
      </div>
    </div>

    <!-- Ubicación dentro del establecimiento -->
    <div class="form-group">
      <label for="level">Selecciona el Nivel / Piso de Entrega:</label>
      <select id="level" required onchange="updateRooms()">
        <option value="">-- Seleccionar Nivel --</option>
        <option value="Nivel 1">Nivel 1 (Planta Baja / Patio Central)</option>
        <option value="Nivel 2">Nivel 2 (Aulas Módulo B)</option>
        <option value="Nivel 3">Nivel 3 (Laboratorios / Informática)</option>
        <option value="Nivel 4">Nivel 4 (Aulas Magna / Terraza)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="locationDetail">Salón, Aula o Carrera Específica:</label>
      <input type="text" id="locationDetail" placeholder="Ej: Salón 302 / Ingeniería en Sistemas" required>
    </div>

    <!-- Datos del Cliente -->
    <div class="form-group">
      <label for="clientName">Nombre del Estudiante / Cliente:</label>
      <input type="text" id="clientName" placeholder="Tu nombre completo" required>
    </div>

    <div class="form-group">
      <label for="phone">Número de WhatsApp de Contacto:</label>
      <input type="tel" id="phone" placeholder="Ej: 55554444" required>
    </div>

    <!-- Forma de Pago Visual -->
    <div class="form-group">
      <label for="payment">Forma de Pago:</label>
      <select id="payment" required>
        <option value="Efectivo Contra Entrega">Efectivo contra entrega en el salón</option>
        <option value="Transferencia / BI Pay (Simulado)">Transferencia Bancaria / BI Pay</option>
        <option value="Tarjeta Débito/Crédito (Simulado)">Tarjeta Débito/Crédito (Terminal Móvil)</option>
      </select>
    </div>

    <!-- Resumen -->
    <div class="summary-box">
      <h3>Monto Total a Pagar</h3>
      <div class="total-price" id="totalDisplay">Q 15.00</div>
    </div>

    <button type="submit" class="btn-submit">Confirmar Pedido</button>
  </form>
</div>

<!-- Modal / Recibo Simulado -->
<div class="modal" id="ticketModal">
  <div class="modal-content">
    <h2 style="color: var(--primary);">¡Pedido Confirmado!</h2>
    <p style="font-size: 13px; color: #555;">Tu pedido ha sido procesado por el sistema de Flanes Luna.</p>
    
    <div class="ticket" id="ticketDetails">
      <!-- Se genera dinámicamente con JS -->
    </div>

    <button class="btn-submit" onclick="sendWhatsApp()" style="background: #25D366; margin-bottom: 8px;">
      📲 Enviar Confirmación por WhatsApp
    </button>
    <button class="close-btn" onclick="closeModal()">Cerrar Recibo</button>
  </div>
</div>

<script>
  let qty = 1;
  const unitPrice = 15;

  function updateQty(change) {
    qty += change;
    if (qty < 1) qty = 1;
    document.getElementById('qtyDisplay').innerText = qty;
    document.getElementById('totalDisplay').innerText = `Q ${(qty * unitPrice).toFixed(2)}`;
  }

  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('clientName').value;
    const phone = document.getElementById('phone').value;
    const level = document.getElementById('level').value;
    const location = document.getElementById('locationDetail').value;
    const payment = document.getElementById('payment').value;
    const total = (qty * unitPrice).toFixed(2);
    const orderNum = Math.floor(1000 + Math.random() * 9000);

    const ticketHTML = `
      <strong>PEDIDO #${orderNum} - FLANES LUNA</strong><br>
      ----------------------------------<br>
      <strong>Cliente:</strong> ${name}<br>
      <strong>Teléfono:</strong> ${phone}<br>
      <strong>Producto:</strong> ${qty} x Porción de Chocoflan<br>
      <strong>Ubicación:</strong> ${level} - ${location}<br>
      <strong>Forma de Pago:</strong> ${payment}<br>
      ----------------------------------<br>
      <strong>TOTAL A PAGAR: Q ${total}</strong>
    `;

    document.getElementById('ticketDetails').innerHTML = ticketHTML;
    document.getElementById('ticketModal').style.display = 'flex';
  });

  function closeModal() {
    document.getElementById('ticketModal').style.display = 'none';
  }

  function sendWhatsApp() {
    const name = document.getElementById('clientName').value;
    const level = document.getElementById('level').value;
    const location = document.getElementById('locationDetail').value;
    const total = (qty * unitPrice).toFixed(2);
    
    const msg = encodeURIComponent(`Hola Flanes Luna, mi pedido es:\n- Cliente: ${name}\n- Cantidad: ${qty} porción(es)\n- Ubicación: ${level}, ${location}\n- Total: Q ${total}`);
    window.open(`https://wa.me/?text=${msg}`, '_blank');
  }
</script>

</body>
</html>
